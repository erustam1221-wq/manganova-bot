<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaNova</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #09090d;
      color: #fff;
      padding: 16px;
      padding-bottom: 80px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      user-select: none;
    }

    .logo span {
      color: #8b5cf6;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2a2a38;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #8b5cf6;
    }

    .search-box {
      background: #12131a;
      border: 1px solid #1e202e;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      width: 100%;
    }

    .search-box input::placeholder {
      color: #525266;
    }

    .banner {
      background: linear-gradient(135deg, #1b132e 0%, #12131a 100%);
      border: 1px solid #2d224d;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .banner-badge {
      background: #7c3aed;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .banner-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .banner-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .btn-primary {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-secondary {
      background: #1e202e;
      color: #fff;
      border: 1px solid #2d224d;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
    }

    .manga-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding-bottom: 4px;
    }

    .manga-grid::-webkit-scrollbar {
      display: none;
    }

    .card {
      min-width: 110px;
      max-width: 110px;
      background: #12131a;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1e202e;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cover {
      height: 140px;
      background: #1a1c29;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #8b5cf6;
      font-size: 20px;
      background-size: cover;
      background-position: center;
    }

    .card-info {
      padding: 10px 8px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .rating {
      font-size: 11px;
      color: #eab308;
    }

    .page {
      display: block;
    }

    .page.hidden {
      display: none;
    }

    .profile-head {
      text-align: center;
      margin: 20px 0 30px;
    }

    .big-profile {
      width: 70px;
      height: 70px;
      background: #1e202e;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .menu-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      background: #12131a;
      border: 1px solid #1e202e;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-align: left;
      cursor: pointer;
    }

    .menu-icon {
      font-size: 18px;
      color: #8b5cf6;
    }

    .menu-text {
      font-size: 13px;
      font-weight: 600;
    }

    .menu-text small {
      display: block;
      color: #666;
      font-size: 11px;
      font-weight: normal;
      margin-top: 2px;
    }

    .back {
      background: none;
      border: none;
      color: #8b5cf6;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: #12131a;
      border: 1px solid #1e202e;
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: #8b5cf6;
    }

    .chapters-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .chapter-item {
      background: #12131a;
      border: 1px solid #1e202e;
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .reader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .reader-container img {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
    }

    .reader-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 10px;
    }

    .user-rating-box {
      background: #12131a;
      border: 1px solid #1e202e;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
      text-align: center;
    }

    .rating-buttons {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .rate-btn {
      background: #1e202e;
      color: #fff;
      border: 1px solid #2d224d;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .rate-btn:hover {
      background: #8b5cf6;
    }
  </style>
</head>
<body>

  <!-- BOSH SAHIFA -->
  <main id="homePage" class="page">
    <div class="top-bar">
      <div class="logo" id="logoBtn">Manga<span>Nova</span></div>
      <div class="avatar" onclick="showProfile()">👤</div>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" oninput="searchManga()" placeholder="Manga qidirish...">
    </div>

    <div class="banner">
      <div class="banner-badge">BUGUNGI TAVSIYA</div>
      <div class="banner-title">Solo Leveling</div>
      <div class="banner-desc">Sung Jin-Woo — eng zaif ovchidan eng kuchli jangchiga aylangan qahramon.</div>
      <button class="btn-primary" onclick="alert('O‘qish boshlandi!')">O‘qishni boshlash →</button>
    </div>

    <section>
      <div class="section-header">
        <div class="section-title">🔥 Barcha Mangalar</div>
      </div>
      <div class="manga-grid" id="popularGrid"></div>
    </section>
  </main>

  <!-- MANGA DETAIL -->
  <main id="mangaDetailPage" class="page hidden">
    <button class="back" onclick="showHome()">← Orqaga</button>
    <div id="mangaDetailContent"></div>

    <div class="user-rating-box">
      <p style="font-size: 13px; font-weight: 600; color: #94a3b8;">Ushbu mangaga o'z bahoingizni bering:</p>
      <div class="rating-buttons">
        <button class="rate-btn" onclick="rateManga(1)">1</button>
        <button class="rate-btn" onclick="rateManga(2)">2</button>
        <button class="rate-btn" onclick="rateManga(3)">3</button>
        <button class="rate-btn" onclick="rateManga(4)">4</button>
        <button class="rate-btn" onclick="rateManga(5)">5</button>
        <button class="rate-btn" onclick="rateManga(6)">6</button>
        <button class="rate-btn" onclick="rateManga(7)">7</button>
        <button class="rate-btn" onclick="rateManga(8)">8</button>
        <button class="rate-btn" onclick="rateManga(9)">9</button>
        <button class="rate-btn" onclick="rateManga(10)">10</button>
      </div>
    </div>

    <h3 style="margin-top: 20px; font-size: 15px; font-weight: 700;">📖 Boblar:</h3>
    <div class="chapters-list" id="chaptersList"></div>
  </main>

  <!-- MANGA READER -->
  <main id="readerPage" class="page hidden">
    <button class="back" onclick="openMangaDetail(currentManga.id)">← Boblarga qarash</button>
    <h3 id="readerTitle" style="font-size: 16px; margin-bottom: 15px; text-align: center;"></h3>
    
    <div class="reader-container" id="readerImages"></div>

    <div class="reader-nav">
      <button class="btn-secondary" style="flex:1" onclick="prevChapter()">← Oldingi bob</button>
      <button class="btn-primary" style="flex:1" onclick="nextChapter()">Keyingi bob →</button>
    </div>
  </main>

  <!-- ADMIN PANEL -->
  <main id="addMangaPage" class="page hidden">
    <button class="back" onclick="showHome()">← Orqaga</button>
    <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 20px;">🔒 Admin Panel</h2>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button class="btn-primary" style="flex:1" onclick="switchAdminTab('manga')">Manga qo'shish</button>
      <button class="btn-secondary" style="flex:1" onclick="switchAdminTab('chapter')">Bob qo'shish</button>
    </div>

    <!-- MANGA FORM -->
    <div id="adminMangaForm">
      <div class="form-group">
        <label>Manga nomi (Title)</label>
        <input type="text" id="mangaTitle" placeholder="Masalan: Solo Leveling">
      </div>
      <div class="form-group">
        <label>Janri (Genre)</label>
        <input type="text" id="mangaGenre" placeholder="Masalan: Action, Fantasy">
      </div>
      <div class="form-group">
        <label>Boshlang'ich Reyting (Masalan: 8.9)</label>
        <input type="text" id="mangaRating" value="8.9" placeholder="8.9">
      </div>
      <div class="form-group">
        <label>Rasm havolasi (Cover Image URL)</label>
        <input type="text" id="mangaImg" placeholder="https://... rasm linki">
      </div>
      <div class="form-group">
        <label>Tavsif (Description)</label>
        <textarea id="mangaDesc" rows="3" placeholder="Manga haqida qisqacha..."></textarea>
      </div>
      <button class="btn-primary" style="width: 100%; padding: 14px;" onclick="addNewManga()">Bazaga qo'shish</button>
    </div>

    <!-- CHAPTER FORM -->
    <div id="adminChapterForm" class="hidden">
      <div class="form-group">
        <label>Manganu tanlang</label>
        <select id="selectMangaForChapter"></select>
      </div>
      <div class="form-group">
        <label>Bob raqami (Chapter Number)</label>
        <input type="number" id="chapterNum" placeholder="Masalan: 1">
      </div>
      <div class="form-group">
        <label>Bob rasmlari havolalari (URL'larni vergul bilan ajrating)</label>
        <textarea id="chapterPages" rows="5" placeholder="https://rasm1.jpg, https://rasm2.jpg"></textarea>
      </div>
      <button class="btn-primary" style="width: 100%; padding: 14px;" onclick="addNewChapter()">Bobni qo'shish</button>
    </div>
  </main>

  <!-- PROFIL SAHIFASI -->
  <main id="profilePage" class="page hidden">
    <button class="back" onclick="showHome()">← Orqaga</button>
    <div class="profile-head">
      <div class="big-profile">👤</div>
      <h2>MangaNova User</h2>
      <p style="color:#888">@manganovauser</p>
    </div>
    <div class="menu-box">
      <button class="menu-item" onclick="alert('Sevimlilar bo\'limi')">
        <div class="menu-icon">♡</div>
        <div class="menu-text">Sevimlilar<small>Saqlangan mangalar</small></div>
      </button>
    </div>
  </main>

  <script>
    const ADMIN_PASSWORD = "Nurqul1201";

    const SUPABASE_URL = 'https://sswzyuvyorbjusnwrzde.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzd3p5dXZ5b3JianVzbndyemRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTUzNzcsImV4cCI6MjEwNjQzMTM3N30.Rzp9NS1ygmc1bV0CSVMMiZyyZk9Hj55PXstfgkjQPQs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allMangas = [];
    let currentManga = null;
    let currentChapterNum = 1;
    let currentMangaChapters = [];

    let clickCount = 0;
    let clickTimer;

    document.getElementById('logoBtn').addEventListener('click', () => {
      clickCount++;
      clearTimeout(clickTimer);

      if (clickCount === 3) {
        clickCount = 0;
        const inputPass = prompt("Admin parolini kiriting:");
        if (inputPass === ADMIN_PASSWORD) {
          showAddManga();
        } else if (inputPass !== null) {
          alert("Xato parol!");
        }
      } else {
        clickTimer = setTimeout(() => {
          clickCount = 0;
        }, 500);
      }
    });

    function hideAllPages() {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    }

    function showHome() {
      hideAllPages();
      document.getElementById('homePage').classList.remove('hidden');
    }

    function showProfile() {
      hideAllPages();
      document.getElementById('profilePage').classList.remove('hidden');
    }

    function showAddManga() {
      hideAllPages();
      document.getElementById('addMangaPage').classList.remove('hidden');
      populateMangaSelect();
    }

    function switchAdminTab(tab) {
      if(tab === 'manga') {
        document.getElementById('adminMangaForm').classList.remove('hidden');
        document.getElementById('adminChapterForm').classList.add('hidden');
      } else {
        document.getElementById('adminMangaForm').classList.add('hidden');
        document.getElementById('adminChapterForm').classList.remove('hidden');
        populateMangaSelect();
      }
    }

    async function loadMangas() {
      const { data, error } = await supabaseClient.from('mangas').select('*');
      if (!error && data) {
        allMangas = data;
        renderMangas(allMangas);
        populateMangaSelect();
      }
    }

    function renderMangas(list) {
      const popularGrid = document.getElementById('popularGrid');
      popularGrid.innerHTML = '';

      if (list.length === 0) {
        popularGrid.innerHTML = '<p style="color:#666; font-size:12px;">Hozircha mangalar yo\'q</p>';
        return;
      }

      list.forEach((item) => {
        const initials = item.title ? item.title.substring(0, 2).toUpperCase() : 'MN';
        const coverStyle = item.img ? `style="background-image: url('${item.img}')"` : '';
        const coverText = item.img ? '' : initials;
        const mangaRating = item.rating ? item.rating : '8.9';

        popularGrid.innerHTML += `
          <article class="card" onclick="openMangaDetail('${item.id}')">
            <div class="cover" ${coverStyle}>${coverText}</div>
            <div class="card-info">
              <div class="card-title">${item.title}</div>
              <div class="rating">★ ${mangaRating}</div>
            </div>
          </article>
        `;
      });
    }

    async function openMangaDetail(mangaId) {
      hideAllPages();
      document.getElementById('mangaDetailPage').classList.remove('hidden');
      
      currentManga = allMangas.find(m => m.id == mangaId);
      if (!currentManga) return;

      const mangaRating = currentManga.rating ? currentManga.rating : '8.9';
      
      document.getElementById('mangaDetailContent').innerHTML = `
        <div style="display:flex; gap:15px; margin-bottom:15px;">
          <img src="${currentManga.img || ''}" style="width:100px; height:140px; border-radius:10px; object-fit:cover; background:#1a1c29;">
          <div>
            <h2 style="font-size:18px;">${currentManga.title}</h2>
            <p style="color:#8b5cf6; font-size:12px; margin:5px 0;">Janri: ${currentManga.genre || 'Belgilanmagan'}</p>
            <p style="color:#eab308; font-size:12px; margin-bottom:5px;">Reyting: ★ ${mangaRating}</p>
            <p style="color:#888; font-size:12px; line-height:1.4;">${currentManga.desc || ''}</p>
          </div>
        </div>
      `;

      const { data, error } = await supabaseClient
        .from('chapters')
        .select('*')
        .eq('manga_id', mangaId)
        .order('chapter_num', { ascending: true });

      const chaptersList = document.getElementById('chaptersList');
      chaptersList.innerHTML = '';

      if (data && data.length > 0) {
        currentMangaChapters = data;
        data.forEach(ch => {
          chaptersList.innerHTML += `
            <div class="chapter-item" onclick="openReader(${ch.chapter_num})">
              <span>${ch.chapter_num}-bob</span>
              <span style="color:#8b5cf6;">O'qish →</span>
            </div>
          `;
        });
      } else {
        chaptersList.innerHTML = '<p style="color:#666; font-size:12px;">Hozircha boblar qo\'shilmadi</p>';
      }
    }

    async function rateManga(score) {
      if (!currentManga) return;

      let currentRating = parseFloat(currentManga.rating) || 8.9;
      let newRating = ((currentRating + score) / 2).toFixed(1);

      const { error } = await supabaseClient
        .from('mangas')
        .update({ rating: String(newRating) })
        .eq('id', currentManga.id);

      if (error) {
        alert("Xatolik: " + error.message);
      } else {
        alert(`Rahmat! Siz ${score} baho berdingiz.`);
        currentManga.rating = String(newRating);
        loadMangas().then(() => {
          openMangaDetail(currentManga.id);
        });
      }
    }

    function openReader(chapterNum) {
      hideAllPages();
      document.getElementById('readerPage').classList.remove('hidden');
      currentChapterNum = chapterNum;

      const chapter = currentMangaChapters.find(c => c.chapter_num == chapterNum);
      document.getElementById('readerTitle').innerText = `${currentManga.title} - ${chapterNum}-bob`;

      const readerImages = document.getElementById('readerImages');
      readerImages.innerHTML = '';

      if (chapter && chapter.pages) {
        let pagesArray = chapter.pages;
        if (typeof pagesArray === 'string') {
          try { pagesArray = JSON.parse(pagesArray); } catch(e) { pagesArray = pagesArray.split(','); }
        }
        if (Array.isArray(pagesArray)) {
          pagesArray.forEach(imgUrl => {
            readerImages.innerHTML += `<img src="${imgUrl.trim()}" alt="Manga Sahifasi">`;
          });
        }
      } else {
        readerImages.innerHTML = '<p style="color:#888;">Ushbu bob rasmlari topilmadi.</p>';
      }
    }

    function nextChapter() {
      const nextNum = currentChapterNum + 1;
      const exists = currentMangaChapters.some(c => c.chapter_num == nextNum);
      if (exists) {
        openReader(nextNum);
      } else {
        alert("Bu oxirgi bob!");
      }
    }

    function prevChapter() {
      const prevNum = currentChapterNum - 1;
      const exists = currentMangaChapters.some(c => c.chapter_num == prevNum);
      if (exists) {
        openReader(prevNum);
      } else {
        alert("Bu birinchi bob!");
      }
    }

    async function addNewManga() {
      const title = document.getElementById('mangaTitle').value.trim();
      const genre = document.getElementById('mangaGenre').value.trim();
      const rating = document.getElementById('mangaRating').value.trim() || "8.9";
      const img = document.getElementById('mangaImg').value.trim();
      const desc = document.getElementById('mangaDesc').value.trim();

      if (!title) return alert("Iltimos, manga nomini kiriting!");

      const { error } = await supabaseClient
        .from('mangas')
        .insert([{ title, genre, rating, img, desc }]);

      if (error) {
        alert("Xatolik: " + error.message);
      } else {
        alert("Manga muvaffaqiyatli qo'shildi!");
        document.getElementById('mangaTitle').value = '';
        document.getElementById('mangaGenre').value = '';
        document.getElementById('mangaImg').value = '';
        document.getElementById('mangaDesc').value = '';
        showHome();
        loadMangas();
      }
    }

    async function addNewChapter() {
      const mangaId = document.getElementById('selectMangaForChapter').value;
      const chapterNum = document.getElementById('chapterNum').value;
      const pagesText = document.getElementById('chapterPages').value.trim();

      if (!mangaId || !chapterNum || !pagesText) {
        return alert("Iltimos, barcha maydonlarni to'ldiring!");
      }

      const pagesArray = pagesText.split(',').map(url => url.trim()).filter(url => url.length > 0);

      const { error } = await supabaseClient
        .from('chapters')
        .insert([{ 
          manga_id: mangaId, 
          chapter_num: parseInt(chapterNum), 
          pages: pagesArray 
        }]);

      if (error) {
        alert("Xatolik: " + error.message);
      } else {
        alert("Bob muvaffaqiyatli qo'shildi!");
        document.getElementById('chapterNum').value = '';
        document.getElementById('chapterPages').value = '';
      }
    }

    function populateMangaSelect() {
      const select = document.getElementById('selectMangaForChapter');
      if (!select) return;
      select.innerHTML = '';
      if (allMangas.length === 0) {
        select.innerHTML = '<option value="">Avval manga qo\'shing</option>';
        return;
      }
      allMangas.forEach(m => {
        select.innerHTML += `<option value="${m.id}">${m.title}</option>`;
      });
    }

    function searchManga() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allMangas.filter(m => m.title.toLowerCase().includes(query));
      renderMangas(filtered);
    }

    loadMangas();
  </script>
</body>
</html>
